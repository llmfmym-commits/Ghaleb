name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Extract Template & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Template ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP template found."
            exit 1
          fi

          echo "Template found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract APK Template
        shell: bash
        run: |
          rm -rf extracted-template
          mkdir -p extracted-template

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted-template

          echo "Template extracted successfully."
          find extracted-template -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        id: locate_project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted-template \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Android Gradle project found inside ZIP."
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android Project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "===== Android Project ====="
          pwd
          echo "===== Files ====="
          find . -maxdepth 2 -type f | sort

      - name: Build Debug APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-webapp-template-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
